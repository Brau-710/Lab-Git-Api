<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chuck Norris Facts</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #c0392b;
      --dark: #111;
      --card: #1a1a1a;
      --text: #f0ece4;
      --muted: #888;
      --accent: #e74c3c;
    }

    body {
      background-color: var(--dark);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow: hidden;
    }

    /* Diagonal background stripe */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -10%;
      width: 60%;
      height: 160%;
      background: var(--red);
      transform: rotate(-8deg);
      opacity: 0.07;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 680px;
      width: 100%;
      text-align: center;
    }

    .logo {
      margin-bottom: 0.2rem;
    }

    .logo img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--red);
      filter: grayscale(100%) contrast(1.1);
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 10vw, 5.5rem);
      letter-spacing: 0.04em;
      line-height: 1;
      color: #fff;
      text-transform: uppercase;
    }

    h1 span {
      color: var(--red);
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 0.4rem;
      margin-bottom: 2.5rem;
    }

    .card {
      background: var(--card);
      border: 1px solid #2a2a2a;
      border-left: 4px solid var(--red);
      border-radius: 4px;
      padding: 2rem 2.5rem;
      min-height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .card.loading {
      opacity: 0.4;
      transform: scale(0.98);
    }

    .card::before {
      content: '"';
      font-family: 'Bebas Neue', sans-serif;
      font-size: 6rem;
      color: var(--red);
      opacity: 0.15;
      position: absolute;
      top: -10px;
      left: 16px;
      line-height: 1;
    }

    #joke-text {
      font-size: 1.15rem;
      line-height: 1.7;
      color: var(--text);
      font-weight: 400;
    }

    .error-text {
      color: var(--accent);
      font-size: 0.95rem;
    }

    .btn {
      margin-top: 2rem;
      background: var(--red);
      color: #fff;
      border: none;
      padding: 0.9rem 2.8rem;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 20px rgba(192, 57, 43, 0.35);
    }

    .btn:hover {
      background: #a93226;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(192, 57, 43, 0.5);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(192, 57, 43, 0.3);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .footer {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: #444;
      letter-spacing: 0.1em;
    }

    @media (max-width: 480px) {
      .card { padding: 1.5rem; }
      #joke-text { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="https://api.chucknorris.io/img/avatar/chuck-norris.png" alt="Chuck Norris" onerror="this.style.display='none'"/>
    </div>
    <h1>Chuck <span>Norris</span></h1>
    <p class="subtitle">facts that cannot be denied</p>

    <div class="card" id="card">
      <p id="joke-text">Carrega no botão e descobre um facto sobre o lendário Chuck Norris.</p>
    </div>

    <button class="btn" id="btn" onclick="fetchJoke()">Nova piada</button>

    <p class="footer">Powered by chucknorris.io &nbsp;|&nbsp; Feito com medo de Chuck</p>
  </div>

  <script>
    const jokeText = document.getElementById('joke-text');
    const card = document.getElementById('card');
    const btn = document.getElementById('btn');

    async function fetchJoke() {
      btn.disabled = true;
      card.classList.add('loading');

      try {
        const res = await fetch('https://api.chucknorris.io/jokes/random');
        if (!res.ok) throw new Error('Falha na API');
        const data = await res.json();
        jokeText.classList.remove('error-text');
        jokeText.textContent = data.value;
      } catch (err) {
        jokeText.classList.add('error-text');
        jokeText.textContent = 'Não foi possível carregar uma piada. Até a internet tem medo de Chuck Norris.';
      } finally {
        card.classList.remove('loading');
        btn.disabled = false;
      }
    }

    // Load one on start
    fetchJoke();
  </script>
</body>
</html>
